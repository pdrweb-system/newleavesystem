<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผู้อำนวยการ — แจ้งผลการเลื่อนเงินเดือน</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="topbar" hidden>
  <h1>แจ้งผลการเลื่อนเงินเดือน · ผู้อำนวยการ</h1>
  <button id="logoutBtn" type="button">ออกจากระบบ</button>
</header>
<main hidden>
  <p class="secret-note">เอกสารลับ — ข้อมูลเงินเดือนรายบุคคล ห้ามเผยแพร่ต่อ</p>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="rounds">รอบ</button>
    <button type="button" role="tab" data-tab="audit">บันทึกการใช้งาน</button>
  </nav>

  <section data-panel="rounds" hidden>
    <div class="card">
      <h2>รอการอนุมัติ</h2>
      <div id="pendingList"></div>
    </div>
    <div id="roundDetail"></div>
    <div id="roundMsg" class="msg" role="status" hidden></div>
    <div class="card">
      <h2>ทุกรอบ</h2>
      <div class="table-wrap">
        <table class="list nowrap">
          <thead><tr><th>ปีที่เริ่ม</th><th>รอบ</th><th>ช่วงเวลา</th><th>สถานะ</th><th>วันที่ลงนาม</th><th></th></tr></thead>
          <tbody id="roundRows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section data-panel="audit" hidden>
    <div class="card">
      <h2>บันทึกการใช้งานล่าสุด (200 รายการ)</h2>
      <div class="table-wrap">
        <table class="list">
          <thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th><th></th></tr></thead>
          <tbody id="auditRows"></tbody>
        </table>
      </div>
      <div id="auditMsg" class="msg" hidden></div>
    </div>
  </section>
</main>
<script src="assets/vendor/supabase-js-2.117.2.js"></script>
<script type="module" src="assets/director.js"></script>
</body>
</html>
