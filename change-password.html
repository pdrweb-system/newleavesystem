<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เปลี่ยนรหัสผ่าน — แจ้งผลการเลื่อนเงินเดือน</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main>
  <form id="pwForm" class="card narrow" novalidate hidden>
    <h1 style="margin-top:0;font-size:22px">ตั้งรหัสผ่านใหม่</h1>
    <p id="intro" class="muted">กรุณาตั้งรหัสผ่านใหม่ก่อนเข้าใช้งาน (อย่างน้อย 8 ตัวอักษร และไม่ใช่รหัสประจำตัว)</p>
    <label for="pw1">รหัสผ่านใหม่</label>
    <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2">ยืนยันรหัสผ่านใหม่</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="submitBtn" class="primary" type="submit">บันทึกรหัสผ่าน</button>
    <div id="msg" class="msg error" role="alert" hidden></div>
    <p><button id="logoutBtn" type="button">ออกจากระบบ</button></p>
  </form>
</main>
<script src="assets/vendor/supabase-js-2.117.2.js"></script>
<script type="module">
import { sb } from './assets/supabase-client.js';
import { guard, getProfile, homeFor, wireLogout } from './assets/auth-guard.js';

const profile = await guard(null, { allowMustChange: true });
const form = document.getElementById('pwForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
const showError = (text) => { msg.textContent = text; msg.hidden = false; };
const loginName = (profile.email ?? '').split('@')[0];

form.hidden = false;
wireLogout();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.hidden = true;
  const pw1 = form.pw1.value, pw2 = form.pw2.value;
  if (pw1.length < 8) return showError('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
  if (pw1.length > 72) return showError('รหัสผ่านยาวเกินไป (ไม่เกิน 72 ตัวอักษร)');
  if (pw1.toLowerCase() === loginName) return showError('ห้ามใช้รหัสประจำตัวเป็นรหัสผ่าน');
  if (pw1 !== pw2) return showError('รหัสผ่านทั้งสองช่องไม่ตรงกัน');

  btn.disabled = true;
  try {
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) {
      showError(error.code === 'same_password' ? 'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม'
        : error.code === 'weak_password' ? 'รหัสผ่านง่ายเกินไป กรุณาตั้งใหม่'
        : 'เปลี่ยนรหัสผ่านไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
      return;
    }
    const updated = await getProfile();
    location.replace(homeFor(updated?.role ?? profile.role));
  } catch {
    showError('เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่อีกครั้ง');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
